name: APIBridge CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APIBRIDGE_DATABASE_URL: "sqlite+aiosqlite:///./data/ci.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: init.sql 与 ORM 一致性检查（task 1.5）
        run: python scripts/gen_init_sql.py --check

      - name: 全量测试（含安全用例：鉴权矩阵 + SSRF 防护，task 2.11）
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 前端依赖安装
        working-directory: frontend-source
        run: npm install
      - name: 前端构建（task 5.1 完成后应转绿）
        working-directory: frontend-source
        run: npm run build
